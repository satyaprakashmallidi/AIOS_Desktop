name: Release

# Triggered when you push a tag matching v*.*.* (e.g. v0.1.0).
# Builds Windows + macOS in parallel, uploads installers to a GitHub
# Release as draft artifacts. Promote the release to "Published" in the
# GitHub UI when you're ready for users to receive the auto-update.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            pyinstallerArch: x64
          # Apple Silicon (arm64) Mac build only. We previously targeted
          # universal2 here but Pillow doesn't ship universal2 wheels —
          # _imaging.cpython-darwin.so installs single-arch on each
          # runner, and PyInstaller's COLLECT step fails ("is not a fat
          # binary!") when assembling a universal2 sidecar. arm64 covers
          # ~all modern Macs (M1+); Intel Mac users can source-build
          # until we add a separate x86_64 matrix entry.
          - os: macos-latest
            platform: mac
            arch: arm64
            pyinstallerArch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build tools + sidecar deps
        run: |
          pip install pyinstaller
          pip install -r python/requirements.txt

      - name: Install npm deps
        run: npm ci

      # Release gate. Runs Python sidecar tests + JS/TS unit tests +
      # full TS build BEFORE we spend ~5 minutes packaging the sidecar
      # and electron-builder. A broken host.py (e.g. dispatch entry
      # referencing an undefined function — see test_dispatch_handlers_all_resolve)
      # fails fast here instead of shipping a "every page is broken" build
      # to auto-update users.
      - name: Release gate (build + tests + Python sidecar dispatch check)
        run: npm run check

      - name: Build Python sidecar
        env:
          AIOS_PYINSTALLER_TARGET_ARCH: ${{ matrix.pyinstallerArch }}
        run: npm run build:python

      - name: Build + publish (Windows)
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIOS_PYINSTALLER_TARGET_ARCH: ${{ matrix.pyinstallerArch }}
        run: npm run release -- --win

      - name: Build + publish (macOS arm64)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mac builds are unsigned for now. When you have an Apple
          # Developer ID add CSC_LINK + CSC_KEY_PASSWORD secrets and the
          # in-app "Check for updates" will switch from manual-download
          # to ShipIt in-place auto-update on Mac too.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          AIOS_PYINSTALLER_TARGET_ARCH: ${{ matrix.pyinstallerArch }}
        run: npm run release -- --mac --arm64

      - name: Upload installer artifacts (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/latest*.yml
          if-no-files-found: ignore
