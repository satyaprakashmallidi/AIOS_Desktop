name: Release

# Triggered when you push a tag matching v*.*.* (e.g. v0.1.0).
# Builds Windows + macOS in parallel, uploads installers to a GitHub
# Release as draft artifacts. Promote the release to "Published" in the
# GitHub UI when you're ready for users to receive the auto-update.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            pyinstallerArch: x64
          # One universal2 Mac build covers both Apple Silicon and Intel Macs
          # in a single .dmg. Replaces the previous arm64+x64 matrix split
          # because GitHub's macos-13 (Intel) runners have brutal queue times
          # that left every release with a phantom job stuck in queue.
          - os: macos-latest
            platform: mac
            arch: universal
            pyinstallerArch: universal2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build tools + sidecar deps
        run: |
          pip install pyinstaller
          pip install -r python/requirements.txt

      - name: Install npm deps
        run: npm ci

      - name: Build Python sidecar
        env:
          AIOS_PYINSTALLER_TARGET_ARCH: ${{ matrix.pyinstallerArch }}
        run: npm run build:python

      - name: Build + publish (Windows)
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIOS_PYINSTALLER_TARGET_ARCH: ${{ matrix.pyinstallerArch }}
        run: npm run release -- --win

      - name: Build + publish (macOS universal)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mac builds are unsigned for now. When you have an Apple
          # Developer ID add CSC_LINK + CSC_KEY_PASSWORD secrets and the
          # in-app "Check for updates" will switch from manual-download
          # to ShipIt in-place auto-update on Mac too.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          AIOS_PYINSTALLER_TARGET_ARCH: ${{ matrix.pyinstallerArch }}
        run: npm run release -- --mac --universal

      - name: Upload installer artifacts (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/latest*.yml
          if-no-files-found: ignore
