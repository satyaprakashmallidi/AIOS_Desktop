name: Dispatch release to public repo

# Tag push on this private source repo fires a `release-tag` event at
# everyai-com/AIOS_Desktop-releases (public). That repo runs the actual
# build (it has unlimited Actions minutes because it's public).
#
# This dispatcher workflow runs in ~5 seconds — well under any free-tier
# quota even for private repos.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to dispatch (e.g. v0.2.49)"
        required: true
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            # github.ref is "refs/tags/v0.2.49" for tag pushes — strip the prefix.
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Dispatch to AIOS_Desktop-releases
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RELEASES_DISPATCH_TOKEN }}
          repository: everyai-com/AIOS_Desktop-releases
          event-type: release-tag
          client-payload: '{"tag": "${{ steps.tag.outputs.tag }}"}'
