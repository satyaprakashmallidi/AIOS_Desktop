name: Release

# Triggered when you push a tag matching v*.*.* (e.g. v0.1.0).
# Builds Windows + macOS in parallel, uploads installers to a GitHub
# Release as draft artifacts. Promote the release to "Published" in the
# GitHub UI when you're ready for users to receive the auto-update.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            pyinstallerArch: x64
          # Apple Silicon (arm64) Mac — runs on GitHub's arm64 runner
          # (macos-latest). Native arch only; PyInstaller bundles the
          # arm64 PIL / pyautogui / pyobjc wheels directly. No fat-
          # binary merging needed.
          - os: macos-latest
            platform: mac
            arch: arm64
            pyinstallerArch: arm64
          # Intel (x86_64) Mac — CROSS-BUILT from Apple Silicon
          # (macos-latest) under Rosetta 2.
          #
          # We previously used `os: macos-13` (the only free Intel runner
          # on GitHub) but its queue is contested for 12+ hours per job.
          # Instead, install python.org's universal2 Python 3.11 on the
          # arm64 runner — it contains both arm64 AND x86_64 slices in
          # one bundle. Then run pip + PyInstaller under `arch -x86_64`
          # so wheel resolution and the resulting Mach-O bits are all
          # x86_64. electron-builder cross-builds the Electron shell
          # for x64 natively via @electron/rebuild. End result: a real
          # Intel DMG produced on an arm64 host with no macos-13 queue.
          #
          # Verified before shipping (queries against PyPI):
          # - pyobjc-{core, Cocoa, Quartz, ApplicationServices} ship
          #   universal2 wheels for cp311 — both arches in one wheel.
          # - Pillow ships a dedicated cp311 x86_64 wheel.
          # - pyautogui/pyscreeze/mouseinfo are sdist-only but pure
          #   Python (no C extensions), so arch is irrelevant.
          - os: macos-latest
            platform: mac
            arch: x64
            pyinstallerArch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build tools + sidecar deps
        run: |
          pip install pyinstaller
          pip install -r python/requirements.txt

      # Cross-build setup for the Intel (x86_64) Mac job. macos-latest
      # is Apple Silicon (arm64) — actions/setup-python above gave us
      # an arm64-only Python that PyInstaller cannot use to produce an
      # x86_64 sidecar. Install python.org's universal2 Python (single
      # bundle, both arches) and pre-install x86_64 wheels under
      # Rosetta. PyInstaller invoked via `arch -x86_64` later produces
      # a real Intel Mach-O binary. This entire block is no-op on
      # every other job.
      - name: Install universal2 Python + x86_64 deps (Intel Mac only)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        run: |
          set -euo pipefail
          curl -L -o /tmp/python-universal2.pkg https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg /tmp/python-universal2.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11
          echo "AIOS_X64_PYTHON=$PY" >> $GITHUB_ENV
          arch -x86_64 $PY -m pip install --upgrade pip
          arch -x86_64 $PY -m pip install pyinstaller
          arch -x86_64 $PY -m pip install -r python/requirements.txt
          # CRITICAL: Pillow ships separate cp311 wheels for
          # macosx_10_10_x86_64 and macosx_11_0_arm64. pip's tag-matching
          # ranks the higher macOS version (11_0 arm64) above the lower
          # one (10_10 x86_64), so even running under `arch -x86_64` on
          # a universal2 Python, pip installs the ARM64 Pillow. PyInstaller
          # then crashes in COLLECT with "incompatible architecture (have
          # 'arm64', need 'x86_64')" on _imaging.cpython-311-darwin.so
          # (the v0.2.11 failure mode).
          #
          # Fix: download the x86_64 wheel directly with --platform
          # (--platform pins to a specific tag, ignoring rank order), then
          # install that local .whl with --no-deps --force-reinstall.
          # Local-file installs skip pip's platform-compat check, so the
          # x86_64 wheel always lands regardless of pip's preferences.
          arch -x86_64 $PY -m pip uninstall -y Pillow
          mkdir -p /tmp/x86_64-wheels
          arch -x86_64 $PY -m pip download \
            --no-deps \
            --platform=macosx_10_10_x86_64 \
            --python-version=3.11 \
            --implementation=cp \
            --abi=cp311 \
            --only-binary=:all: \
            --dest=/tmp/x86_64-wheels \
            Pillow
          arch -x86_64 $PY -m pip install --no-deps --force-reinstall /tmp/x86_64-wheels/Pillow-*.whl
          # Sanity check (must report Mach-O x86_64). file(1) failing or
          # reporting arm64 here = stop now, don't waste minutes on a
          # build that's guaranteed to fail in COLLECT later.
          PIL_SO=/Library/Frameworks/Python.framework/Versions/3.11/lib/python3.11/site-packages/PIL/_imaging.cpython-311-darwin.so
          file "$PIL_SO"
          file "$PIL_SO" | grep -q x86_64 || { echo "Pillow _imaging.so is not x86_64 — aborting"; exit 1; }

      - name: Install npm deps
        run: npm ci

      # Release gate. Runs Python sidecar tests + JS/TS unit tests +
      # full TS build BEFORE we spend ~5 minutes packaging the sidecar
      # and electron-builder. A broken host.py (e.g. dispatch entry
      # referencing an undefined function — see test_dispatch_handlers_all_resolve)
      # fails fast here instead of shipping a "every page is broken" build
      # to auto-update users.
      - name: Release gate (build + tests + Python sidecar dispatch check)
        run: npm run check

      # Default sidecar build — Windows + Mac arm64 use system PyInstaller
      # (from `actions/setup-python`'s pip install above) on the native arch.
      - name: Build Python sidecar
        if: '!(matrix.platform == ''mac'' && matrix.arch == ''x64'')'
        env:
          AIOS_PYINSTALLER_TARGET_ARCH: ${{ matrix.pyinstallerArch }}
        run: npm run build:python

      # Intel Mac sidecar — invoke PyInstaller from the universal2
      # Python via Rosetta, so EVERY collected binary (host bootloader,
      # Pillow's _imaging, pyobjc framework slices, etc.) is x86_64
      # Mach-O. AIOS_PYINSTALLER_TARGET_ARCH=x86_64 is also read by
      # build/aios-host.spec (sets EXE target_arch) for belt-and-braces.
      - name: Build Python sidecar (Intel via Rosetta)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        env:
          AIOS_PYINSTALLER_TARGET_ARCH: x86_64
        run: arch -x86_64 "$AIOS_X64_PYTHON" -m PyInstaller --noconfirm --clean build/aios-host.spec

      # IMPORTANT: every publish step below calls `release:no-python`
      # — NOT `release`. The `release` script re-runs `npm run build:python`
      # which would clobber the already-built sidecar with whatever the
      # default system Python produces. On the Intel Mac job that would
      # silently overwrite our cross-built x86_64 sidecar with an arm64
      # one (the original v0.2.9 regression). For Windows + Mac arm64
      # it's just wasted minutes. release:no-python uses the sidecar
      # built by the previous step as-is.
      - name: Build + publish (Windows)
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:no-python -- --win

      - name: Build + publish (macOS arm64)
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (electron-builder reads these automatically):
          # CSC_LINK = base64-encoded Developer ID Application .p12
          # CSC_KEY_PASSWORD = .p12 export password
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization (electron-builder also reads these automatically
          # when mac.notarize is enabled in package.json):
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run release:no-python -- --mac --arm64

      - name: Build + publish (macOS x64 / Intel)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run release:no-python -- --mac --x64

      - name: Upload installer artifacts (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/latest*.yml
          if-no-files-found: ignore
